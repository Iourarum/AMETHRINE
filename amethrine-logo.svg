<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240"
     role="img" aria-label="AMETHRINE logo: an ideal hyperbolic triangle in the Poincare disk" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AMETHRINE</title>
  <desc>Three geodesics of the Poincare disk model, in red, yellow and blue, meeting
        at three ideal points on the boundary to form an ideal hyperbolic triangle.
        Each arc is a circle orthogonal to the boundary circle; the arc geometry was
        computed by Amethrine::Geometry::Hyperbolic.ideal_geodesic_circle.</desc>

  <defs>
    <clipPath id="disk">
      <circle cx="120" cy="120" r="100"/>
    </clipPath>
  </defs>

  <!-- the disk: the whole hyperbolic plane, compressed into a finite circle -->
  <circle cx="120" cy="120" r="100" fill="#fbfbfd" stroke="#1b1b1f" stroke-width="3"/>

  <!-- the three geodesics, clipped to the disk.
       Centres and radii are exact: |centre|^2 = 1 + r^2 (orthogonality). -->
  <g clip-path="url(#disk)" fill="none" stroke-width="9" stroke-linecap="round">
    <!-- red:    (120,20) -> (33.4,170),  centre (-53.2,20),  r 173.2 -->
    <path d="M 120,20 A 173.2,173.2 0 0 1 33.4,170"  stroke="#d7263d"/>
    <!-- yellow: (33.4,170) -> (206.6,170), centre (120,320), r 173.2 -->
    <path d="M 33.4,170 A 173.2,173.2 0 0 1 206.6,170" stroke="#f4c20d"/>
    <!-- blue:   (206.6,170) -> (120,20),  centre (293.2,20), r 173.2 -->
    <path d="M 206.6,170 A 173.2,173.2 0 0 1 120,20"  stroke="#1e6fd9"/>
  </g>

  <!-- the three ideal points: where the geodesics meet, at infinity -->
  <g fill="#1b1b1f">
    <circle cx="120"   cy="20"  r="7"/>
    <circle cx="33.4"  cy="170" r="7"/>
    <circle cx="206.6" cy="170" r="7"/>
  </g>
</svg>
